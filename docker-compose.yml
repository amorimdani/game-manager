services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ludus
      POSTGRES_PASSWORD: ludus_dev_password
      POSTGRES_DB: ludus
    volumes:
      - ludus_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludus -d ludus"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ludus:ludus_dev_password@db:5432/ludus?schema=public
      AUTH_SECRET: local-dev-secret-ludus-2026
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/uploads
    volumes:
      - ludus_uploads:/app/uploads
    ports:
      - "3000:3000"

volumes:
  ludus_pgdata:
  ludus_uploads:
