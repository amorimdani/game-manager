apiVersion: v1
kind: Namespace
metadata:
  name: game-manager
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: game-manager
  labels:
    app.kubernetes.io/instance: game-manager-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: game-manager-uploads-pvc
  namespace: game-manager
  labels:
    app.kubernetes.io/instance: game-manager-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: game-manager
  labels:
    app: postgres
    app.kubernetes.io/instance: game-manager-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: ludus
            - name: POSTGRES_DB
              value: ludus
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: game-manager-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: game-manager
  labels:
    app: postgres
    app.kubernetes.io/instance: game-manager-app
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-manager-app
  namespace: game-manager
  labels:
    app: game-manager-app
    app.kubernetes.io/instance: game-manager-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-manager-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: game-manager-app
    spec:
      containers:
        - name: game-manager-app
          image: game-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: game-manager-secret
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: game-manager-secret
                  key: AUTH_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: game-manager-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: game-manager-service
  namespace: game-manager
  labels:
    app: game-manager-app
    app.kubernetes.io/instance: game-manager-app
spec:
  type: ClusterIP
  selector:
    app: game-manager-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-manager-ingress
  namespace: game-manager
  labels:
    app.kubernetes.io/instance: game-manager-app
  annotations:
    cert-manager.io/cluster-issuer: duckdns-letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: game-manager.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: game-manager-service
                port:
                  number: 3000
  tls:
    - hosts:
        - game-manager.duckdns.org
      secretName: game-manager-tls-certificate
