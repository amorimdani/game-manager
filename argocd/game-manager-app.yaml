apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-manager-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/amorimdani/game-manager.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: game-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
